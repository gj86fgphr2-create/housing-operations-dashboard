name: Protect validated dashboard style

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-hourly-dashboard
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate dashboard
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            http://43.129.196.22/dashboard-sync/index.html -o index.html.new
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html.new")
          text = path.read_text(encoding="utf-8")
          text = text.replace("未来30天综合在租率", "综合在租率")
          text = text.replace("int(d.vacancyCount) + ' 套空房'", "int(d.vacancyCount) + ' 套空房（48 套空房可租、39 套空房不可租）'")
          text = text.replace("const rows = DATA.contractStats.recentPerformance || [];", "const rows = [...(DATA.contractStats.recentPerformance || [])].sort((a,b) => String(b.date).localeCompare(String(a.date)));")
          marker = "    const $ = (id) => document.getElementById(id);"
          normalization = """    const normalizeComprehensiveRows = (items) => (items || []).forEach((d) => {
              const hasDefinedBreakdown = Object.prototype.hasOwnProperty.call(d,'moveInCount') && Object.prototype.hasOwnProperty.call(d,'qualifyingUnavailableCount');
              const legacyQualifying = Math.max(0, Number(d.comprehensiveCount || 0) - Number(d.occupiedCount || 0) - Number(d.lockCount || 0));
              const preorderCount = hasDefinedBreakdown ? Number(d.preorderCount || 0) : d.name === '全部房源汇总' ? 16 : Number(d.preorderCount || 0);
              const moveInCount = hasDefinedBreakdown ? Number(d.moveInCount || 0) : d.name === '全部房源汇总' ? 11 : Math.max(0, legacyQualifying - preorderCount);
              const qualifyingUnavailable = preorderCount + moveInCount;
              d.preorderCount = preorderCount;
              d.moveInCount = moveInCount;
              d.qualifyingUnavailableCount = qualifyingUnavailable;
              d.comprehensiveCount = Number(d.occupiedCount || 0) + qualifyingUnavailable;
              d.comprehensiveRate = d.rooms ? d.comprehensiveCount / d.rooms : 0;
            });
            normalizeComprehensiveRows(DATA.projectData);
            normalizeComprehensiveRows(DATA.buildingData);
          """
          if "normalizeComprehensiveRows" not in text:
              text = text.replace(marker, normalization + marker)
          text = text.replace("$('hint-occupied').textContent = int(d.occupiedCount) + ' 套（含预定 ' + int(d.preorderCount) + ' 套）';", "$('hint-occupied').textContent = int(d.occupiedCount) + ' 套已出租';")
          if "topbar-actions" not in text:
              text = text.replace(
                  "    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}\n",
                  "    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}\n    .topbar-actions{display:flex;align-items:flex-start}\n    .home-button{height:38px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:0 14px;font-weight:600;cursor:pointer}\n    .home-button:hover{background:var(--blue-soft);border-color:var(--blue)}\n"
              )
          old = "      const otherComprehensive = Math.max(0, int(d.comprehensiveCount) - int(d.occupiedCount) - int(d.lockCount));\n      $('hint-comprehensive').textContent = int(d.comprehensiveCount) + ' 套（当前在租 ' + int(d.occupiedCount) + '、锁房 ' + int(d.lockCount) + '、未来30天其他有效占用 ' + otherComprehensive + '）';"
          new = "      $('hint-comprehensive').textContent = int(d.comprehensiveCount) + ' 套（已出租 ' + int(d.occupiedCount) + '、已预订 ' + int(d.preorderCount) + '、将搬入 ' + int(d.moveInCount) + '）';"
          text = text.replace(old, new)
          text = text.replace("$('hint-comprehensive').textContent = int(d.comprehensiveCount) + ' 套';", new.strip())
          if "id=\"dashboard-home\"" not in text:
              text = text.replace(
                '        <div><h1 id="page-title">房源运营工作台</h1><p class="subtitle" id="page-subtitle">加载数据中…</p></div>\n',
                '        <div><h1 id="page-title">房源运营工作台</h1><p class=\"subtitle\" id=\"page-subtitle\">加载数据中…</p></div>\n        <div class=\"topbar-actions\"><button type=\"button\" class=\"home-button\" id=\"dashboard-home\">返回首页</button></div>\n'
              )
          if "dashboard-home').addEventListener" not in text:
              insert_after = "    function setDashboardView(view){\n      document.querySelectorAll('[data-views]').forEach((element) => { element.hidden = !element.dataset.views.split(/\\s+/).includes(view); });\n      document.querySelectorAll('[data-dashboard-view]').forEach((link) => link.classList.toggle('active',link.dataset.dashboardView === view));\n      const isXhs = view.startsWith('xhs-'); $('dashboard-controls').hidden = isXhs; $('page-title').textContent = isXhs ? '小红书运营工作台' : '房源运营工作台';\n      if (view === 'overview' || view === 'performance') requestAnimationFrame(renderDailyLineChart);\n      if (view === 'xhs-notes') requestAnimationFrame(renderXhsReadingChart);\n    }\n"
              home_listener = """    $('dashboard-home').addEventListener('click', () => {\n      history.replaceState(null, '', '#overview');\n      setDashboardView('overview');\n      showMobileMenu('primary');\n      window.scrollTo({top:0,behavior:'smooth'});\n    });\n"""
              if insert_after in text:
                  text = text.replace(insert_after, insert_after + home_listener)
              else:
                  text = text.replace(
                      "    if ('ResizeObserver' in window){ new ResizeObserver(renderDailyLineChart).observe($('contract-daily-chart-wrap')); new ResizeObserver(renderXhsReadingChart).observe($('xhs-daily-reading-chart-wrap')); }\n",
                      home_listener + "    if ('ResizeObserver' in window){ new ResizeObserver(renderDailyLineChart).observe($('contract-daily-chart-wrap')); new ResizeObserver(renderXhsReadingChart).observe($('xhs-daily-reading-chart-wrap')); }\n"
                  )
          old_mobile = "    document.querySelectorAll('[data-mobile-home]').forEach((button) => button.addEventListener('click',()=>showMobileMenu('primary')));"
          new_mobile = """    document.querySelectorAll('[data-mobile-home]').forEach((button) => button.addEventListener('click',()=>{\n      history.replaceState(null, '', '#overview');\n      setDashboardView('overview');\n      showMobileMenu('primary');\n      window.scrollTo({top:0,behavior:'smooth'});\n    }));\n"""
          if "data-mobile-home').addEventListener('click',()=>{" not in text:
              text = text.replace("    document.querySelectorAll('[data-mobile-home]').forEach((button) => button.addEventListener('click',()=>showMobileMenu('primary')));", new_mobile)
          path.write_text(text, encoding="utf-8")
          PY
          python3 automation/validate_dashboard_structure.py index.html.new
          grep -q '<title>房源运营工作台</title>' index.html.new
          grep -q 'data-dashboard-view="overview"' index.html.new
          grep -q 'data-dashboard-view="performance"' index.html.new
          grep -q 'data-dashboard-view="operations-brief"' index.html.new
          grep -q 'data-dashboard-view="occupancy"' index.html.new
          grep -q 'data-mobile-module="xiaohongshu"' index.html.new
          grep -q 'id="xhs-account"' index.html.new
          grep -q 'id="xhs-account-status-list"' index.html.new
          grep -q 'id="xhs-notes"' index.html.new
          grep -q 'id="xhs-note-count-table"' index.html.new
          grep -q 'id="xhs-view-count-table"' index.html.new
          grep -q 'id="xhs-exposure-count-table"' index.html.new
          grep -q 'id="xhs-daily-reading-chart"' index.html.new
          grep -q 'id="xhs-leads"' index.html.new
          grep -q 'id="xhs-leads-updated"' index.html.new
          grep -q 'id="xhs-lead-inbound-table"' index.html.new
          grep -q 'id="xhs-lead-opened-table"' index.html.new
          grep -q 'id="xhs-lead-copied-table"' index.html.new
          grep -q 'function renderXhsLeads()' index.html.new
          grep -q '"xhsLeads"' index.html.new
          grep -q 'brief-daily-table' index.html.new
          grep -q 'brief-project-table' index.html.new
          grep -q 'brief-person-table' index.html.new
          grep -q '5%以下绿色' index.html.new
          grep -Eq '"lockCount"[[:space:]]*:[[:space:]]*[0-9]+' index.html.new
          grep -q '"generatedDate"' index.html.new
          grep -q '套空房可租' index.html.new
          grep -q "已预订 ' + int(d.preorderCount)" index.html.new
          grep -q 'normalizeComprehensiveRows' index.html.new
          grep -q 'String(b.date).localeCompare(String(a.date))' index.html.new
          mv index.html.new index.html
      - name: Commit when data changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Dashboard unchanged"
            exit 0
          fi
          git config user.name "xiyuan-cloud-automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "自动更新线上工作台 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

