name: Protect validated dashboard style

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-hourly-dashboard
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate dashboard
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            http://43.129.196.22/dashboard-sync/index.html -o index.html.new
          grep -q '<title>房源运营工作台</title>' index.html.new
          grep -q 'data-dashboard-view="overview"' index.html.new
          grep -q 'data-dashboard-view="checkout"' index.html.new
          grep -q 'data-dashboard-view="performance"' index.html.new
          grep -q 'data-dashboard-view="operations-brief"' index.html.new
          grep -q 'data-dashboard-view="occupancy"' index.html.new
          grep -q 'brief-daily-table' index.html.new
          grep -q 'brief-project-table' index.html.new
          grep -q 'brief-person-table' index.html.new
          grep -q '5%以下绿色' index.html.new
          grep -Eq '"lockCount"[[:space:]]*:[[:space:]]*[0-9]+' index.html.new
          grep -q '"generatedDate"' index.html.new
          mv index.html.new index.html
      - name: Commit when data changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Dashboard unchanged"
            exit 0
          fi
          git config user.name "xiyuan-cloud-automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "自动更新线上工作台 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

