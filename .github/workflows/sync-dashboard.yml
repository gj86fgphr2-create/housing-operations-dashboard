name: Protect validated dashboard style

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-hourly-dashboard
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated full dashboard
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            https://wecom.xiyuan.chat/dashboard-sync/index.html -o index.html.new
          grep -q '<title>鎴挎簮杩愯惀宸ヤ綔鍙?/title>' index.html.new
          grep -q 'data-dashboard-view="overview"' index.html.new
          grep -q 'data-dashboard-view="checkout"' index.html.new
          grep -q 'data-dashboard-view="performance"' index.html.new
          grep -q 'data-dashboard-view="occupancy"' index.html.new
          grep -q '5%浠ヤ笅缁胯壊' index.html.new
          mv index.html.new index.html
      - name: Commit when data changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Dashboard unchanged"
            exit 0
          fi
          git config user.name "xiyuan-cloud-automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "鑷姩鏇存柊绾夸笂宸ヤ綔鍙?$(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

